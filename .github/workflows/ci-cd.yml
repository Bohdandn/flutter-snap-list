name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Lint package
        run: |
          flutter pub get
          flutter analyze
      - name: Build package
        run: flutter pub publish --dry-run
      - name: Lint example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Build example app
        working-directory: example
        run: flutter build web --wasm --release --base-href /flutter-snap-list/
      - name: Run package tests
        id: package_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter=github 2>&1 | tee "$RUNNER_TEMP/package-tests.txt"
      - name: Run example tests
        id: example_tests
        continue-on-error: true
        working-directory: example
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter=github 2>&1 | tee "$RUNNER_TEMP/example-tests.txt"
      - name: Report test results
        if: always()
        env:
          PACKAGE_TESTS_OUTCOME: ${{ steps.package_tests.outcome }}
          EXAMPLE_TESTS_OUTCOME: ${{ steps.example_tests.outcome }}
        shell: bash
        run: |
          append_test_report() {
            local title="$1"
            local outcome="$2"
            local report_file="$3"
            local status_icon

            if [[ "$outcome" == "success" ]]; then
              status_icon="🟢"
            else
              status_icon="🔴"
            fi

            {
              printf '## %s %s\n\n```text\n' "$status_icon" "$title"
              if [[ -f "$report_file" ]]; then
                sed '/^::group::/d; /^::endgroup::/d' "$report_file"
              else
                printf 'No test report was produced.\n'
              fi
              printf '\n```\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          append_test_report "Package tests" "$PACKAGE_TESTS_OUTCOME" "$RUNNER_TEMP/package-tests.txt"
          append_test_report "Example tests" "$EXAMPLE_TESTS_OUTCOME" "$RUNNER_TEMP/example-tests.txt"

          if [[ "$PACKAGE_TESTS_OUTCOME" != "success" || "$EXAMPLE_TESTS_OUTCOME" != "success" ]]; then
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  cd:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
