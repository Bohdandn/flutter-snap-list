name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run tests and add report to summary
        run: |
          if flutter test --reporter=github 2>&1 | tee test-report.txt; then
            test_status=0
          else
            test_status=$?
          fi

          {
            printf '## Flutter test report\n\n```text\n'
            sed '/^::group::/d; /^::endgroup::/d' test-report.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"
      - run: flutter pub publish --dry-run
